name: Generate Meerlanden Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Meerlanden calendar
        env:
          POSTCODE: ${{ secrets.POSTCODE }}
          HOUSE_NUMBER: ${{ secrets.HOUSE_NUMBER }}
          HOUSE_LETTER: ${{ secrets.HOUSE_LETTER }}
        run: python generate_calendar.py

      - name: Validate generated calendar
        run: |
          test -s docs/meerlanden.ics
          grep -q "BEGIN:VCALENDAR" docs/meerlanden.ics
          grep -q "BEGIN:VEVENT" docs/meerlanden.ics
          grep -q "END:VCALENDAR" docs/meerlanden.ics

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/meerlanden.ics

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de afvalkalender."
          else
            git commit -m "Update Meerlanden afvalkalender"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: generate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
